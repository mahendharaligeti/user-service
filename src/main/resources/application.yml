server:
  port: 8081

spring:
  application:
    name: user-service
  jpa:
    open-in-view: false

logging:
  level:
    root: INFO
    com.hospital.userservice: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app:
  jwt:
    secret: a-256-bit-secret-key-for-hospital-user-service-must-be-256-bits
    expiration: 86400000
